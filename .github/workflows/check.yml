# The one check every repository exposes (ADRs 0020, 0021): the organisation ruleset requires a check named "check".
# Keep the repository's own jobs; list every one of them under `needs`. This job fails if any failed or was cancelled.
# No `paths:` filter on this workflow: a required check that never starts blocks the merge.
# The Actions budget (ADR 0023, amended 2026-10-03): non-draft pull requests only, never push to main,
# cancel superseded runs per ref, a timeout on every job. A docs-only change skips heavy jobs inside the job, not here.
name: check
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # A Home Assistant custom component with no tests. Home Assistant's own validators, hassfest
    # (home-assistant/actions) and hacs/action, are not on the organisation's Actions allow-list, so this
    # runs what the stack has: every Python file parses under 3.13 (the component uses 3.12 syntax; Home
    # Assistant 2025.11 runs 3.13), and the manifest, strings and translations are valid JSON.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with: { persist-credentials: false }
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with: { python-version: "3.13" }
      - name: Every Python file parses
        run: python -m py_compile custom_components/cync/*.py docs/cync_probe.py
      - name: The manifest, strings and translations are valid JSON
        run: |
          for f in custom_components/cync/manifest.json custom_components/cync/strings.json custom_components/cync/translations/*.json; do
            python -c 'import json, sys; json.load(open(sys.argv[1]))' "$f"
          done
  check:
    if: ${{ always() && !github.event.pull_request.draft }}
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every needed job passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          jq -e 'all(.[]; . == "success" or . == "skipped")' <<<"$RESULTS"
